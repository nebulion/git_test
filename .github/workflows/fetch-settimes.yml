name: Fetch official III Points pages

on:
  workflow_dispatch:
  push:
    branches: [ccr-84c56106-kllwcz]
    paths: [.github/workflows/fetch-settimes.yml, .github/scripts/**, kompakt-map/source/.refetch]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pages (raw HTML and rendered DOM)
        run: |
          mkdir -p kompakt-map/source
          UA="Mozilla/5.0 (Linux; Android 12) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Mobile Safari/537.36"
          for p in set-times stages lineup experience; do
            curl -sSL -A "$UA" "https://www.iiipoints.com/$p/" -o "kompakt-map/source/$p.raw.html" || true
            timeout 90 google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=15000 \
              --user-agent="$UA" --dump-dom "https://www.iiipoints.com/$p/" > "kompakt-map/source/$p.dom.html" 2>/dev/null || true
          done
          # JS bundles behind the set-times island (Saturday data lives there) and their imports
          for js in $(grep -ohE '/_astro/[A-Za-z0-9_.-]+\.js' kompakt-map/source/set-times.raw.html | sort -u); do
            curl -sSL -A "$UA" "https://www.iiipoints.com$js" -o "kompakt-map/source/$(basename $js)" || true
          done
          for f in kompakt-map/source/*.js; do
            for js in $(grep -ohE '\./[A-Za-z0-9_.-]+\.js' "$f" | sort -u); do
              [ -f "kompakt-map/source/$(basename $js)" ] || curl -sSL -A "$UA" "https://www.iiipoints.com/_astro/$(basename $js)" -o "kompakt-map/source/$(basename $js)" || true
            done
          done
          # Festival map images (try larger variants too; keep only real images)
          mkdir -p kompakt-map/source/map
          for n in festival-map-2026-1080.webp festival-map-2026-600.webp festival-map-2026-1600.webp festival-map-2026-1920.webp \
                   festival-map-2026-2160.webp festival-map-2026-2400.webp festival-map-2026-3000.webp festival-map-2026.webp \
                   festival-map-2026.png festival-map-2026.jpg festival-map-2026.pdf festival-map-2026-1080.png festival-map-2026-1080.jpg; do
            curl -sSL -A "$UA" "https://www.iiipoints.com/assets/campaign/$n" -o "kompakt-map/source/map/$n" || true
            if ! file "kompakt-map/source/map/$n" | grep -qiE 'image|pdf|RIFF'; then rm -f "kompakt-map/source/map/$n"; fi
          done
          for p in guide venue-travel music-map mokiworld; do
            curl -sSL -A "$UA" "https://www.iiipoints.com/$p/" -o "kompakt-map/source/$p.raw.html" || true
          done
          ls -laR kompakt-map/source
      - name: Capture map images from the live site (Chrome)
        run: |
          npm init -y >/dev/null && npm i --no-save playwright@1.48.2 >/dev/null
          node .github/scripts/capture_map.mjs || true
          # more size/format guesses for the campaign map
          for n in 1200 1280 1440 1500 1600 1800 1920 2000 2048 2160 2400 2560 2700 3000 3240 3600 4000 4320; do
            for ext in webp png jpg avif; do
              f="kompakt-map/source/map/festival-map-2026-$n.$ext"
              curl -sSfL -A "$UA" "https://www.iiipoints.com/assets/campaign/festival-map-2026-$n.$ext" -o "$f" || rm -f "$f"
            done
          done
          for n in festival-map-2026 festival-map festival-map-2026-full festival-map-2026-hires festival-map-2026@2x festival-map-2026-2x; do
            for ext in webp png jpg svg pdf avif; do
              f="kompakt-map/source/map/$n.$ext"
              curl -sSfL -A "$UA" "https://www.iiipoints.com/assets/campaign/$n.$ext" -o "$f" || rm -f "$f"
              [ -f "$f" ] && ! file "$f" | grep -qiE 'image|pdf|RIFF|SVG' && rm -f "$f"
            done
          done
          ls -la kompakt-map/source/map
        env:
          UA: "Mozilla/5.0 (Linux; Android 12) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Mobile Safari/537.36"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f kompakt-map/source
          git commit -m "Add snapshot of official III Points pages" || exit 0
          git push
