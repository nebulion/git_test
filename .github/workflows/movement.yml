name: Fetch festival data
on:
  push:
    branches: [movement-fetch]
    paths: [.github/workflows/movement.yml, .github/scripts/fest.mjs]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm init -y >/dev/null && npm i --no-save playwright@1.48.2 >/dev/null
          mkdir -p fests/primavera-2027/api
          for sec in barcelona barcelona-line-up line-up-barcelona barcelona-lineup lineup-barcelona barcelona-map map-barcelona barcelona-mapa barcelona-info; do
            curl -sS -m 30 -A "Mozilla/5.0" -G "https://graphql.primaverasound.com/prod/graphql" \
              --data-urlencode 'query=query Get($section: String!) { getSection(name: $section) { post responseCode } }' \
              --data-urlencode "variables={\"section\":\"$sec\"}" -o "fests/primavera-2027/api/section-$sec.json" || true
          done
          for sec in lineup barcelona-lineup-2027 lineup-barcelona-2027; do
            curl -sS -m 30 -A "Mozilla/5.0" -G "https://graphql.primaverasound.com/prod/graphql" \
              --data-urlencode 'query=query Get($section: String!) { getSection(name: $section) { post responseCode } }' \
              --data-urlencode "variables={\"section\":\"$sec\"}" -o "fests/primavera-2027/api/section-$sec.json" || true
          done
          node .github/scripts/fest.mjs primavera-2027 https://www.primaverasound.com/en/barcelona/lineup || true
          ls -laR fests | head -100
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f fests
          git commit -m "Add festival snapshots" || exit 0
          git pull --rebase origin movement-fetch && git push
