name: Fetch festival data
on:
  push:
    branches: [movement-fetch]
    paths: [.github/workflows/movement.yml, .github/scripts/fest.mjs]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm init -y >/dev/null && npm i --no-save playwright@1.48.2 >/dev/null
          node .github/scripts/fest.mjs primavera-2027 https://www.primaverasound.com/en/barcelona https://www.primaverasound.com/en/barcelona/line-up || true
          ls -laR fests | head -100
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f fests
          git commit -m "Add festival snapshots" || exit 0
          git pull --rebase origin movement-fetch && git push
